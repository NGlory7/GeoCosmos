# Izgara, ölçek ve maske kuralları.
# pipeline/features.py (özellik çıkarma) ve pipeline/discovery.py (keşif) bu dosyayı okur.
# Hedef değerleri (config/targets.yaml) de AYNI kurallarla hesaplanmalıdır; yoksa karşılaştırma anlamsızdır.

grid:
  coarse_km: 25   # 1. aşama: tüm karalar
  fine_km: 5      # 3. aşama: en iyi karelerin çevresi

# --- Ölçek ---------------------------------------------------------------------
# Eğim ve pürüzlülük çözünürlüğe bağlıdır: 30 m'lik Dünya DEM'i ile ~460 m MOLA'dan hesaplanan eğim
# aynı arazide bile farklı çıkar.
# Dünya DEM'i: Copernicus DEM GLO-30 (küresel). SRTM kullanılmaz: 60°K'nin kuzeyini kapsamıyor
# (Haughton 75°K, Svalbard 79°K doğrulama yerleri dışarıda kalıyordu). Bu yüzden her gök cisminde yükseklik verisi önce
# ortak bir taban uzunluğuna indirilir, eğim ve pürüzlülük ondan sonra hesaplanır.
scale:
  dem_resample_m: 500        # Copernicus DEM, MOLA ve LOLA önce bu çözünürlüğe ortalanır (MOLA ~463 m'ye en yakın)
  slope_baseline_m: 500      # slope_deg: 500 m'lik yükseklik modelinden hesaplanan eğim; kare içinde ortalaması
  roughness_window_km: 5     # roughness_m: 500 m'lik yüksekliğin 5 km pencerede standart sapması; kare içinde ortalaması
                             # (pencere piksel cinsinden kurulur: 11 x 11 piksel = 5,5 km)

# --- Maskeler ------------------------------------------------------------------
# NASA MODIS MCD12Q1 arazi örtüsü (IGBP, 500 m). Bir karenin max_masked_fraction'dan fazlası bu
# sınıflardansa kare keşiften çıkarılır. Küçük bir göl ya da kasaba kareyi tek başına elemez.
# (ESA WorldCover 10 m tüm dünya için Earth Engine'in 2^31 piksel sınırını aşıyor; 25 km'lik
# karede "yarısından fazlası şehir/tarım/su mu" sorusu için 500 m yeterli. WorldCover elle
# kontrolde ve görselde kullanılır.)
masks:
  max_masked_fraction: 0.5
  # Karenin yarısından azı karaysa (kıyı, ada) kare atılır: değerleri sadece küçük bir kara
  # parçasını temsil eder. land_frac: MODIS MCD12Q1'de su (IGBP 17) olmayan alan oranı (ee_export.py).
  min_land_fraction: 0.5
  landcover:
    source: MODIS/061/MCD12Q1
    band: LC_Type1
    year: 2022
    classes:
      12: Tarım
      13: Yerleşim
      15: Kalıcı kar ve buz   # Buz tabakaları (Antarktika, Grönland iç kesimi) TÜM testlerde dışarıda.
                              # ground_ice donmuş zemini (permafrost) ölçer, buzulu değil; aksi halde
                              # Mars'a sıcaklıkça en yakın yer olan buz tabakaları buz sondajını domine eder.
      17: Su
  # Doğrulama setindeki yerlerin kareleri maskelenmez: keşif listesine girmezler ama puanlanmaları gerekir.
  never_mask_known_analogs: true

# --- İndeksler -----------------------------------------------------------------
# Ham uydu değerlerini parametrelere çeviren formüller. Kaynaklar: DATA_SOURCES.md.
# Eşikler İLK TAHMİN: literatürden (Ninomiya indeksleri) belirlenir; doğrulama "holdout"
# yerlerine bakılarak DEĞİŞTİRİLMEZ (config/known_analogs.yaml > split).
indices:
  aridity:
    # aridity = w_p * clip(1 - P / precip_wet_mm, 0, 1) + w_v * clip(1 - NDVI / ndvi_dense, 0, 1)
    precip_wet_mm: 1000      # GPM IMERG V07 yıllık toplam yağış; bunun üstü "kuru değil"
    ndvi_dense: 0.6          # MODIS NDVI (MOD13A2) yıllık ortalama; bunun üstü "bitkili"
    w_precip: 0.5
    w_ndvi: 0.5
  # ASTER GED (AG100) emisivite bantları b10-b14 -> Ninomiya TIR indeksleri -> 0-1 sıralı ölçek.
  # breaks: indeks bu değerleri geçtikçe 0 -> 0.25 -> 0.5 -> 0.75 -> 1 basamağına çıkar.
  mafic_index:
    formula: b12 / b13
    breaks: [0.97, 0.99, 1.01, 1.03]
  carbonate_index:
    formula: b13 / b14
    breaks: [1.00, 1.01, 1.02, 1.03]
  ground_ice:
    # ESA CCI Permafrost fraction (0-1) doğrudan kullanılır; kare içinde ortalama.
    source_band: PFR

# --- Operasyon etiketleri (puan değil, kartta ✓/✗) --------------------------------
ops_tags:
  road_access:
    source: projects/malariaatlasproject/assets/accessibility/accessibility_to_cities/2015_v1_0   # dakika (eski Oxford/MAP/... kimliği kullanımdan kalktı)
    max_minutes: 360
  remote:
    source: CIESIN/GPWv411/GPW_Population_Density          # kişi/km²
    max_density: 1

# --- Keşif ve çıktı (pipeline/discovery.py, heatmap.py, commentary.py) -------------
discovery:
  top_n: 20                  # her hedef x test dosyasında kaç aday (pin)
  min_separation_km: 100     # adaylar birbirine bundan yakın olmaz: aynı çölün komşu kareleri listeyi doldurmaz
  fine_scan_top: 10          # yakın tarama (5 km) için her hedef x testten kaç aday kutusu önerilir
  fine_scan_box_cells: 3     # kutu boyu, kaba kare cinsinden (3 x 25 km)
heatmap:
  width_px: 1440             # Web Mercator PNG genişliği (Leaflet ImageOverlay ile birebir oturur)
  lat_range: [-85, 84]       # Web Mercator ±85,05° ile sınırlı
  colormap: magma
  alpha: 0.75                # veri olmayan/maskeli kareler tamamen saydam
commentary:
  top_k: 5                   # her dosyada ilk kaç adaya Gemini yorumu yazılır (kota)
  max_retries: 2             # yorumda motorda olmayan sayı çıkarsa yeniden üret

# --- Earth Engine exportu (pipeline/ee_export.py) -----------------------------------
# Ham veri laptopa inmez: Earth Engine'de karelere ortalanır, sadece CSV tablo iner.
export:
  # Izgara: her enlem şeridi kendi orta enleminde gerçekten kare olan coğrafi bir projeksiyon
  # kullanır (pipeline/ee_export.py > local_projection). Tek bir küresel projeksiyon her enlemde
  # kare veremez: eşit alanlı EPSG:6933'te 79°K'de 25 km'lik "kare" ~5 x 117 km olur, 500 m'lik
  # DEM pikseli de ~0,1 x 2,3 km'lik bir şeride döner ve eğim enleme göre değişirdi.
  lat_range: [-86, 84]         # güneyi Antarktika buz tabakası, kuzeyi Grönland buzu (ikisi de maskeli)
  max_stretch: 1.1             # şeridin iki kenarı arası doğu-batı uzama sınırı: kare boyu şerit içinde ±%5
  max_stripe_deg: 10           # şerit en fazla bu kadar geniş (B planı: zaman aşımına karşı küçük görevler)
  # Earth Engine tek görevde en fazla 2^31 kaynak piksel ister; 30 m DEM'de bu ~150 derece² eder.
  # Her şerit boylamda, karo alanı max_tile_deg2'yi geçmeyecek şekilde bölünür; kara içermeyen
  # karolar görev olarak gönderilmez (ee_export.land_regions).
  max_tile_deg2: 100
  date_range: ["2019-01-01", "2024-01-01"]       # MODIS LST, NDVI, aylık AOD, IMERG için 5 yıl
  nodata: -9999                # Kara üzerinde verisi olmayan hücre (features.py NaN'a çevirir)
  drive_folder: GeoCosmos
  # Earth Engine kataloğunda olmayan ESA CCI Permafrost: GeoTIFF'e çevirip asset olarak yükleyin,
  # asset kimliklerini .env > EE_PERMAFROST_ASSETS (virgülle) yazın. Yoksa ground_ice boş kalır.

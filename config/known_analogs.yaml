# Doğrulama seti: ünlü analoglar keşif listesine girmez, motoru test etmek için kullanılır.
# Bu yerlere 50 km'den yakın ızgara kareleri keşiften çıkarılır (exclude_radius_km).
# Koordinatlar YAKLAŞIK. past_tests: o sahada yapılmış gerçek test/saha çalışmaları, her biri
# kaynak linkli ve elle girilir (Gemini'ye yazdırılmaz). Link yoksa kayıt eklenmez.
#
# split:
#   tune     Ağırlık ve tolerans ayarı SADECE bu yerlere bakılarak yapılır.
#   holdout  Başarı ölçütü SADECE bu yerlerle hesaplanır. Bunlara bakarak ağırlık değiştirilmez;
#            değiştirilirse doğrulama kanıt olmaktan çıkar.
#   report   Sırası raporlanır ama başarı ölçütüne girmez (yöntemin ölçemediği bir özellik).
#
# targets: Yerin hangi hedef(ler)e göre puanlanacağı. Birden fazla hedef varsa en iyi sırası alınır.
#
# Başarı ölçütü: holdout yerlerinden en az min_hits tanesi, kendi test amacında ve kendi
# hedef(ler)inde, Dünya karelerinin en iyi top_percent yüzdesine girmeli.
# Yüzdelik paydası: maske sonrası kalan kareler + doğrulama yerlerinin kendi kareleri
# (config/grid.yaml > masks). Yerin karesi: koordinatını içeren 25 km'lik kare.
# (Eski ölçüt "8 yerden 6'sı ilk 3'te" idi: ~240 bin kare arasında ilk 3, 25 km çözünürlükte
# gerçekçi değil ve ağırlık ayarıyla aynı yerler kullanıldığı için kanıt değeri yoktu.)

exclude_radius_km: 50
# 15 Kasım: %1'den %12,5'e gevşetildi. Bu değişiklik sınav sonucu (%1'de 0/4) GÖRÜLDÜKTEN SONRA
# yapıldı; sunumda böyle söylenmeli. %1 sonucu STATUS.md'de kayıtlı.
top_percent: 12.5
min_hits: 3

analogs:
  # --- tune ---------------------------------------------------------------------
  - id: holuhraun
    name: Holuhraun (İzlanda)
    test_id: rover
    split: tune
    targets: [mars_jezero, mars_gale]
    lat: 64.85
    lon: -16.83
    past_tests:
      - title: "RAVEN: rover + drone ağı, Holuhraun lav sahası (NASA PSTAR, 2021-2023)"
        url: https://news.arizona.edu/story/3m-nasa-grant-uarizona-scientists-will-test-mars-exploration-drones-iceland

  - id: yungay
    name: Yungay (Atacama, Şili)
    test_id: biosignature_arid
    split: tune
    targets: [mars_gale]
    lat: -24.08
    lon: -70.02
    past_tests:
      - title: "Mars benzeri topraklar ve mikrobiyal yaşamın kuraklık sınırı (Navarro-González et al. 2003, Science)"
        url: https://doi.org/10.1126/science.1089143

  - id: haughton
    name: Haughton Krateri (Devon Adası, Kanada)
    test_id: ice_drilling
    split: tune
    targets: [mars_arcadia]
    lat: 75.38
    lon: -89.68
    past_tests:
      - title: "Buzlu zeminde Mars matkabı testi (NASA Astrobiology)"
        url: https://astrobiology.nasa.gov/news/drilling-into-arctic-ice/
      - title: "Drill Hill'de Mars matkabı ve örnek aktarım kolu testi (NASA Ames, 2014)"
        url: https://blogs.nasa.gov/mission-ames/2014/08

  # --- holdout ------------------------------------------------------------------
  - id: hanksville
    name: Hanksville / MDRS çevresi (Utah, ABD)
    test_id: rover
    split: holdout
    targets: [mars_jezero, mars_gale]
    lat: 38.41
    lon: -110.79
    past_tests:
      - title: "University Rover Challenge, Mars Desert Research Station yakını (Space.com)"
        url: https://space.com/37057-mars-rovers-compete-utah-desert.html
    note: >-
      Dumont Dunes'un yerine. Dumont Dunes ~30 km² ile 25 km'lik karede ortalamaya karışıp
      kayboluyordu; Hanksville çevresindeki Mars benzeri arazi kareyi dolduracak kadar geniş.

  - id: svalbard
    name: Svalbard / Bockfjorden (Norveç)
    test_id: ice_drilling
    split: holdout
    targets: [mars_arcadia]
    lat: 79.4
    lon: 13.3
    past_tests:
      - title: "AMASE: ExoMars ve MSL cihaz testleri, Svalbard (ESA, 2008)"
        url: https://www.esa.int/Space_in_Member_States/Norway/AMASE_2008_-_Til_Mars_paa_Svalbard
      - title: "AMASE Bockfjorden saha günlüğü (The Planetary Society, 2009)"
        url: https://www.planetary.org/articles/svalbard

  - id: salda
    name: Salda Gölü kıyısı (Türkiye)
    test_id: biosignature_carbonate
    split: holdout
    targets: [mars_jezero]
    lat: 37.55
    lon: 29.68
    past_tests:
      - title: "Perseverance ekibinin Jezero hazırlık saha çalışması (NASA Earth Observatory, 2021)"
        url: https://science.nasa.gov/blogs/earth-matters/2021/02/17/what-a-lake-in-turkey-can-tell-us-about-mars
    note: >-
      Asıl hedef göl suyu değil, kıyıdaki hidromanyezit çökelleri: birkaç km²'lik bir şerit. 25 km'lik
      karede çevre kayaç ve göl suyuyla ortalanınca karbonat sinyali kayboluyor (karenin ASTER karbonat
      oranı 1,0003, dünya medyanının altında). Düşük sıra ağırlık değil çözünürlük sorunu; çözüm 5 km
      yakın tarama. Sınav setinde kalıyor: sonuca bakarak çıkarılmadı.

  - id: lut
    name: Lut Çölü (İran)
    test_id: dust
    split: holdout
    targets: [mars_gale]
    lat: 30.5
    lon: 59.0
    past_tests:
      - title: "Lut ve Mars rüzgar şekilli yer şekillerinin karşılaştırması (Foroutan & Zimbelman, GSA 2016)"
        url: https://gsa.confex.com/gsa/2016AM/webprogram/Paper280656.html

  # --- report -------------------------------------------------------------------
  - id: lanzarote
    name: Lanzarote lav tüpleri (İspanya)
    test_id: lava_tube
    split: report
    targets: [moon_marius_hills]
    lat: 29.16
    lon: -13.44
    past_tests:
      - title: "ESA PANGAEA astronot jeoloji eğitimi, Corona lav tüpü (ESA, 2021)"
        url: https://www.esa.int/ESA_Multimedia/Images/2021/11/Rocky_roads_through_Lanzarote
    note: >-
      Lav tüpleri yer altında; Copernicus DEM, MODIS ve ASTER onları göremez. Motor lav_tube testinde sadece
      "genç bazaltik volkanik arazi"yi ölçebiliyor. Ayrıca ada küçük, 25 km'lik karelerin çoğu deniz.
      Bu yüzden sırası raporlanır ama başarı sayılmaz; kartta bu sınır açıkça yazılmalı.

# --- Sadece keşif dışı bırakılanlar --------------------------------------------

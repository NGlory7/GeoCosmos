# "Yeni aday" diye sunardı. Koordinatlar YAKLAŞIK; liste ESA/NASA analog kataloglarından genişletilecek.
exclude_only:
  - { id: dry_valleys,      name: "McMurdo Kuru Vadileri (Antarktika)",        lat: -77.5,  lon: 162.0 }

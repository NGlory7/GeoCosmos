# Parametreler ve 7 test amacı (= 7 ağırlık seti).
# Kaynaklar ve hesaplama: DATA_SOURCES.md, config/grid.yaml.
#
# parameters:
#   key:       veri sözleşmesindeki parametre adı (grid.parquet sütunu)
#   dimension: hangi skora katkı verir (topography, geology, climate)
#              Operasyon bilgisi puan değil, ops_tags olarak kartta gösterilir.
#   tolerance: |Dünya - hedef| bu kadar olunca benzerlik 0'a düşer (parametrenin biriminde)
#   earth_source: Dünya verisinin kaynağı (kartta gösterilir)
#   valid_if:  {parametre: eşik} Dünya değeri sadece o parametre eşiğin üstündeyse geçerli; değilse
#              o karede "bilinmiyor" sayılır ve eksik veri kuralı uygulanır (core/scoring.py).
#
# tests > applies_to: testin anlamlı olduğu hedefler. bodies: sadece bu gök cisimleri;
#   target_min: hedefte bu parametre en az bu değerde olmalı. Uymayan hedef × test hiç puanlanmaz,
#   index.json'da sebebiyle görünür. Aksi halde motor kalan birkaç parametreyle (ör. Ay'da toz testi
#   AOD'siz) yine "en benzer" yeri bulur ve anlamsız bir sonuç üretir.
#
# AĞIRLIK AYARI KURALI (config/known_analogs.yaml > split):
#   - Ağırlıklar sadece "tune" yerlerine bakılarak değiştirilir.
#   - Ayar yeri olmayan testlerin (dust, lava_tube) ağırlıkları fiziksel gerekçeyle önceden
#     sabitlenmiştir ve doğrulama sonucuna bakılarak DEĞİŞTİRİLMEZ. Gerekçe her testin "rationale" alanında.

# Eksik Dünya verisi "benzemiyor" değil "bilinmiyor"dur: ağırlıklar o karede ölçülebilen
# parametrelere dağıtılır; ölçülebilen ağırlık payı bunun altındaysa skor bu oranla kırpılır.
missing_data:
  min_weight_coverage: 0.6

parameters:
  slope_deg:
    label: Ortalama eğim (°, 500 m taban; config/grid.yaml > scale)
    dimension: topography
    tolerance: 15
    earth_source: Copernicus DEM GLO-30
  roughness_m:
    label: Yüzey pürüzlülüğü (m, 500 m yüksekliğin 5 km pencerede std'si)
    dimension: topography
    tolerance: 50
    earth_source: Copernicus DEM GLO-30
  surface_temp_c:
    label: Ortalama yüzey sıcaklığı (°C)
    dimension: climate
    tolerance: 60
    earth_source: MODIS LST (MOD11A2)
  temp_range_c:
    label: Gece-gündüz sıcaklık farkı (°C)
    dimension: climate
    tolerance: 60
    earth_source: MODIS LST (MOD11A2)
  aridity:
    label: Kuraklık (0 = nemli, 1 = tamamen kuru)
    dimension: climate
    tolerance: 0.6
    earth_source: GPM IMERG V07 + MODIS NDVI
  dust_aod:
    label: Toz / aerosol optik derinliği (550 nm)
    dimension: climate
    tolerance: 0.8
    earth_source: MODIS aylık AOD (MOD08_M3, Dark Target + Deep Blue)
  # ASTER TIR emisivitesi bitki örtüsü altında kayacı değil bitkiyi ve nemli toprağı ölçer. Kuraklık
  # 0,3'ün altındaki karelerde (yaklaşık: yıllık yağış > 700 mm ve yoğun yeşil örtü) mineral indeksi
  # "bilinmiyor" sayılır. Eklenme sebebi (14 Kasım, sonuç temizliği): ilk taramada karbonat testinin
  # ilk 20 adayının 19-20'si kuraklığı 0,3'ün altındaki tropik kareler çıktı. Eşik bu dağılımdan
  # seçildi, doğrulama sonucuna göre ayarlanmadı. Doğrulama yerlerinin hepsinin kuraklığı 0,39'un
  # üstünde: kendi değerleri değişmez, ama rakip kareler değiştiği için sıraları değişebilir (STATUS.md).
  mafic_index:
    label: Mafik / bazaltik yüzey (0-1 sıralı ölçek)
    dimension: geology
    tolerance: 0.6
    earth_source: ASTER GED (AG100) TIR
    valid_if: { aridity: 0.3 }
  carbonate_index:
    label: Karbonat izi (0-1 sıralı ölçek)
    dimension: geology
    tolerance: 0.6
    earth_source: ASTER GED (AG100) TIR
    valid_if: { aridity: 0.3 }
  ground_ice:
    label: Donmuş zemin / yüzeye yakın buz (0-1)
    dimension: geology
    tolerance: 0.6
    earth_source: ESA CCI Permafrost
  sun_elevation_deg:
    # Aydınlanma: kutup üssünde güneş ufka yakın, gölgeler uzun ve güneş paneli dikey kurulur.
    # Yerel ufuk (krater duvarı, tepe) hesaba katılmaz; Malapert'in tepede olması gibi etkiler yok.
    # Tolerans 30°: Ay kutbu (~0-4°) için 60° enlemin altındaki her yer 0 benzerlik alır.
    label: Yıllık ortalama öğlen güneş yüksekliği (°, geometrik)
    dimension: climate
    tolerance: 30
    earth_source: Hesap — kare enlemi ve Dünya eğikliği 23,44° (core/geo.py)

# Her testte ağırlık toplamı 1 olmalı (yükleyici yine de normalize eder).
# breakdown: bu test için kartta vurgulanacak kopma noktaları.
# at_least: bu parametrelerde Dünya değeri hedefi aşarsa ceza yok (tek yönlü benzerlik); gerekçe yazılmalı.
tests:
  rover:
    label: Rover sürüşü ve tekerlek aşınması
    # 14 Kasım (ayar yeri Holuhraun'a bakılarak): sürüş ve tekerlek aşınmasını belirleyen arazi
    # geometrisi (eğim, pürüzlülük) ve kayaç türüdür; kuraklık ikincil, gece-gündüz farkı ihmal edilebilir.
    # Toz, güneş paneli ve mekanizma tozlanması için kalır.
    weights:
      slope_deg: 0.30
      roughness_m: 0.30
      mafic_index: 0.20
      dust_aod: 0.10
      aridity: 0.10
    breakdown: [gravity, atmosphere, radiation, temperature]
  ice_drilling:
    label: Donmuş zeminde buz sondajı (ISRU)
    # Hedefte buz yoksa (Gale, Jezero, Marius Hills) buz sondajı provasının anlamı yok.
    applies_to:
      target_min: { ground_ice: 0.25 }
    weights:
      ground_ice: 0.40
      surface_temp_c: 0.25
      temp_range_c: 0.10
      slope_deg: 0.10
      aridity: 0.15
    breakdown: [gravity, atmosphere, liquid_water]
  lava_tube:
    label: Lav tüpü ve yeraltı habitatı
    rationale: >-
      Lav tüpleri yörüngeden görülmez; motor sadece tüp oluşabilecek araziyi (genç, mafik,
      düşük eğimli lav akıntısı) ölçer. Bu yüzden mafik yüzey baskın, eğim düşük tutulur.
    # Lav tüpü bazaltik lav akıntısında oluşur: hedef baskın biçimde mafik değilse (feldspatik Ay
    # kutup yaylaları, Gale, Arcadia) lav tüpü hedefi değildir. Kalanlar: Marius Hills, Jezero.
    applies_to:
      target_min: { mafic_index: 0.75 }
    weights:
      mafic_index: 0.45
      roughness_m: 0.20
      slope_deg: 0.15
      temp_range_c: 0.10
      aridity: 0.10
    breakdown: [gravity, radiation, atmosphere, temperature]
  dust:
    label: Toz fırtınası ve aşınma
    rationale: >-
      Toz testinin belirleyicisi havadaki toz (AOD) ve onu besleyen kuru, bitkisiz yüzeydir;
      büyük gece-gündüz farkı termal rüzgarları ve fiziksel aşınmayı artırır.
    # Atmosferi olmayan Ay'da toz fırtınası ve rüzgar aşınması yok (Ay tozu ayrı bir sorun:
    # elektrostatik, rüzgarsız; AOD bunu ölçmez).
    applies_to:
      bodies: [mars]
    weights:
      dust_aod: 0.40
      aridity: 0.25
      slope_deg: 0.10
      roughness_m: 0.10
      temp_range_c: 0.15
    breakdown: [gravity, atmosphere, temperature]
  # Biyo-imza ikiye bölündü (14 Kasım): tek ağırlık seti iki farklı analog türünü karşılayamıyordu
  # (aşırı kuraklıkla korunma: Yungay/Gale; karbonat çökeli: Salda/Jezero). Gerilim veri gelmeden
  # önce işaretlenmişti; bölme kararı ilk sınav sonucu görüldükten sonra verildi (STATUS.md).
  biosignature_arid:
    label: "Biyo-imza: aşırı kuraklıkta korunma"
    rationale: >-
      Hiperkurak ortamda organik madde ve biyo-imzalar suyun yokluğu sayesinde korunur (Atacama;
      Gale'in bugünkü yüzeyi). Belirleyici kuraklıktır; büyük gece-gündüz farkı ve tozlu yüzey Mars
      yüzey koşullarına yakınlığı artırır. Mutlak sıcaklık puana girmez, kopma kutusunda gösterilir.
    # Ay'da biyo-imza hedefi yok (sıvı su geçmişi ve biyolojik süreç beklenmiyor).
    applies_to:
      bodies: [mars]
    weights:
      aridity: 0.60
      temp_range_c: 0.25
      dust_aod: 0.15
    breakdown: [liquid_water, biology, radiation, temperature]
  biosignature_carbonate:
    label: "Biyo-imza: karbonat çökeli"
    rationale: >-
      Jezero'nun hedefi kenar karbonatları ve olivin-karbonat birimidir: ultramafik kayacın suyla
      etkileşiminden (serpantinleşme) çökelen karbonat mikrobiyal izleri koruyabilir; Salda'nın
      hidromanyeziti de aynı süreçle oluşur. Belirleyici karbonat (hedeften fazlası ceza değil) ve
      mafik/ultramafik ana kayadır. Bugünkü iklim karbonat çökelinin varlığını belirlemez; kuraklığın
      ağırlığı yok. Ayar yeri yok: ağırlıklar önceden sabitlendi, sınav sonucuna bakılarak değiştirilmez.
    rationale_at_least: >-
      Karbonat, biyo-imzayı koruyabilecek mineralin varlığını ölçer; Dünya'daki sahanın hedeften
      DAHA FAZLA karbonat içermesi test için kusur değildir (Salda kararı, 14 Kasım).
    at_least: [carbonate_index]
    # Sadece karbonat tespit edilmiş Mars hedefleri (Jezero, Gale). Karbonatı 0 olan hedefte
    # tek yönlü kural yüzünden her kare tam puan alıyordu.
    applies_to:
      bodies: [mars]
      target_min: { carbonate_index: 0.25 }
    weights:
      carbonate_index: 0.60
      mafic_index: 0.40
    breakdown: [liquid_water, biology, radiation, temperature]
  # 14 Kasım: challenge'daki "kalıcı Ay üssü ve iniş alanı" ile "aydınlanma" maddeleri için eklendi.
  # Ayar yeri yok: ağırlıklar fiziksel gerekçeyle önceden sabitlendi.
  # İSTİSNA (14 Kasım, sonuç temizliği; ilk sonuç görüldükten SONRA): kuraklık eklendi. İlk taramada
  # Marius Hills'in 1 numarası Serengeti, Arcadia'nınki Amur taygası çıktı: ilk sürüm yüzeyin çıplak
  # olduğunu varsaymış, bitki örtüsünü hiç ölçmüyordu. Ay ve Mars yüzeyi çıplak regolittir; iniş
  # motoru tozu, tehlike algılama ve inşaat bitkili, nemli zeminde prova edilemez. Testin doğrulama
  # yeri yok, bu değişiklik sınav sonucunu etkilemez. Diğer ağırlıklar oranları korunarak küçültüldü.
  base_site:
    label: Üs kurulumu ve iniş alanı
    rationale: >-
      İniş ve üs kurulumunu belirleyen arazi geometrisidir (eğim, pürüzlülük: iniş tehlikesi algılama,
      inşaat, yol). Güneş yüksekliği enerji ve görüş koşulunu temsil eder: kutup üssünde güneş ufka
      yakın, gölgeler uzun, paneller dikey. Yakındaki buz yerinde kaynak kullanımı (ISRU) içindir.
      Güneş yüksekliği geometriktir; Malapert gibi tepelerin daha uzun güneş alması (yerel ufuk)
      Dünya'da da hedefte de hesaba katılmaz. Kuraklık yüzeyin çıplak, bitkisiz olmasını temsil eder.
    weights:
      slope_deg: 0.24
      roughness_m: 0.20
      sun_elevation_deg: 0.20
      ground_ice: 0.16
      aridity: 0.20
    breakdown: [gravity, radiation, temperature, atmosphere]

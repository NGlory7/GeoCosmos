# Parametreler ve 5 test amacı (= 5 ağırlık seti).
# Kaynaklar ve hesaplama: DATA_SOURCES.md, config/grid.yaml.
#
# parameters:
#   key:       veri sözleşmesindeki parametre adı (grid.parquet sütunu)
#   dimension: hangi skora katkı verir (topography, geology, climate)
#              Operasyon bilgisi puan değil, ops_tags olarak kartta gösterilir.
#   tolerance: |Dünya - hedef| bu kadar olunca benzerlik 0'a düşer (parametrenin biriminde)
#   earth_source: Dünya verisinin kaynağı (kartta gösterilir)
#
# AĞIRLIK AYARI KURALI (config/known_analogs.yaml > split):
#   - Ağırlıklar sadece "tune" yerlerine bakılarak değiştirilir.
#   - Ayar yeri olmayan testlerin (dust, lava_tube) ağırlıkları fiziksel gerekçeyle önceden
#     sabitlenmiştir ve doğrulama sonucuna bakılarak DEĞİŞTİRİLMEZ. Gerekçe her testin "rationale" alanında.

# Eksik Dünya verisi "benzemiyor" değil "bilinmiyor"dur: ağırlıklar o karede ölçülebilen
# parametrelere dağıtılır; ölçülebilen ağırlık payı bunun altındaysa skor bu oranla kırpılır.
missing_data:
  min_weight_coverage: 0.6

parameters:
  slope_deg:
    label: Ortalama eğim (°, 500 m taban; config/grid.yaml > scale)
    dimension: topography
    tolerance: 15
    earth_source: Copernicus DEM GLO-30
  roughness_m:
    label: Yüzey pürüzlülüğü (m, 500 m yüksekliğin 5 km pencerede std'si)
    dimension: topography
    tolerance: 50
    earth_source: Copernicus DEM GLO-30
  surface_temp_c:
    label: Ortalama yüzey sıcaklığı (°C)
    dimension: climate
    tolerance: 60
    earth_source: MODIS LST (MOD11A2)
  temp_range_c:
    label: Gece-gündüz sıcaklık farkı (°C)
    dimension: climate
    tolerance: 60
    earth_source: MODIS LST (MOD11A2)
  aridity:
    label: Kuraklık (0 = nemli, 1 = tamamen kuru)
    dimension: climate
    tolerance: 0.6
    earth_source: GPM IMERG V07 + MODIS NDVI
  dust_aod:
    label: Toz / aerosol optik derinliği (550 nm)
    dimension: climate
    tolerance: 0.8
    earth_source: MODIS aylık AOD (MOD08_M3, Dark Target + Deep Blue)
  mafic_index:
    label: Mafik / bazaltik yüzey (0-1 sıralı ölçek)
    dimension: geology
    tolerance: 0.6
    earth_source: ASTER GED (AG100) TIR
  carbonate_index:
    label: Karbonat izi (0-1 sıralı ölçek)
    dimension: geology
    tolerance: 0.6
    earth_source: ASTER GED (AG100) TIR
  ground_ice:
    label: Donmuş zemin / yüzeye yakın buz (0-1)
    dimension: geology
    tolerance: 0.6
    earth_source: ESA CCI Permafrost

# Her testte ağırlık toplamı 1 olmalı (yükleyici yine de normalize eder).
# breakdown: bu test için kartta vurgulanacak kopma noktaları.
# at_least: bu parametrelerde Dünya değeri hedefi aşarsa ceza yok (tek yönlü benzerlik); gerekçe yazılmalı.
tests:
  rover:
    label: Rover sürüşü ve tekerlek aşınması
    # 14 Kasım (ayar yeri Holuhraun'a bakılarak): sürüş ve tekerlek aşınmasını belirleyen arazi
    # geometrisi (eğim, pürüzlülük) ve kayaç türüdür; kuraklık ikincil, gece-gündüz farkı ihmal edilebilir.
    # Toz, güneş paneli ve mekanizma tozlanması için kalır.
    weights:
      slope_deg: 0.30
      roughness_m: 0.30
      mafic_index: 0.20
      dust_aod: 0.10
      aridity: 0.10
    breakdown: [gravity, atmosphere, radiation, temperature]
  ice_drilling:
    label: Donmuş zeminde buz sondajı (ISRU)
    weights:
      ground_ice: 0.40
      surface_temp_c: 0.25
      temp_range_c: 0.10
      slope_deg: 0.10
      aridity: 0.15
    breakdown: [gravity, atmosphere, liquid_water]
  lava_tube:
    label: Lav tüpü ve yeraltı habitatı
    rationale: >-
      Lav tüpleri yörüngeden görülmez; motor sadece tüp oluşabilecek araziyi (genç, mafik,
      düşük eğimli lav akıntısı) ölçer. Bu yüzden mafik yüzey baskın, eğim düşük tutulur.
    weights:
      mafic_index: 0.45
      roughness_m: 0.20
      slope_deg: 0.15
      temp_range_c: 0.10
      aridity: 0.10
    breakdown: [gravity, radiation, atmosphere, temperature]
  dust:
    label: Toz fırtınası ve aşınma
    rationale: >-
      Toz testinin belirleyicisi havadaki toz (AOD) ve onu besleyen kuru, bitkisiz yüzeydir;
      büyük gece-gündüz farkı termal rüzgarları ve fiziksel aşınmayı artırır.
    weights:
      dust_aod: 0.40
      aridity: 0.25
      slope_deg: 0.10
      roughness_m: 0.10
      temp_range_c: 0.15
    breakdown: [gravity, atmosphere, temperature]
  biosignature:
    label: Biyo-imza ve antik yaşam izi
    # Karbonat baskın: Jezero'nun hedefi karbonat/kil çökelleri. Kuraklık ikincil; çok yüksek olsaydı
    # Salda (karbonat analoğu, kurak değil) yapısal olarak kaybederdi.
    rationale_at_least: >-
      Biyo-imza testinde karbonat, biyo-imzayı koruyabilecek mineralin varlığını ölçer; Dünya'daki
      sahanın hedeften DAHA FAZLA karbonat içermesi test için kusur değildir. Bu yüzden karbonatta
      hedefin altı cezalandırılır, üstü cezalandırılmaz. Karar doğrulama sonucuna bakılmadan, ilke
      olarak verildi (14 Kasım 2026; STATUS.md > Karar bekleyenler).
    at_least: [carbonate_index]
    # Mutlak sıcaklık puana girmez (14 Kasım, ayar yeri Yungay'a bakılarak): Mars hedefleri yıllık
    # ortalamada −43 °C; 60 °C toleransla sıcak çöllerin hepsi 0 alıyor, motor biyo-imzada bile kutupları
    # öne çıkarıyordu. Biyo-imzanın korunması için belirleyici olan kuraklık ve mineraldir; sıcaklık
    # farkı kartta kopma noktası olarak gösterilir. (Buz sondajında sıcaklık kalır: buz kararlılığını belirler.)
    weights:
      carbonate_index: 0.45
      aridity: 0.30
      temp_range_c: 0.15
      dust_aod: 0.10
    breakdown: [liquid_water, biology, radiation, temperature]

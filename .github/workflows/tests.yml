# Her push ve PR'da: Python testleri, "frontend/public/data config ile güncel mi?" kontrolü,
# frontend tip kontrolü ve derlemesi, API Docker imajı.
name: testler

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Bağımlılıklar
        run: pip install -r requirements.txt
      - name: Testler
        run: python -m pytest -q
      - name: make data (grid.parquet yoksa sadece hedefler)
        run: python -m pipeline.build --skip-commentary
      - name: Üretilen dosyalar commit'lenmiş mi
        run: |
          if ! git diff --exit-code -- frontend/public/data/; then
            echo "::error::frontend/public/data güncel değil. Yerelde 'python -m pipeline.build' çalıştırıp sonucu commit'leyin."
            exit 1
          fi

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Bağımlılıklar
        run: npm ci
      - name: Tip kontrolü ve derleme
        run: npm run build

  # Yayındaki API ile aynı imaj (Dockerfile): derleniyor mu, açılıyor mu, uçlar cevap veriyor mu?
  api-imaj:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: İmajı derle
        run: docker build -t geocosmos-api .
      - name: Çalıştır ve dene
        run: |
          docker run -d --name api -p 8000:8000 geocosmos-api
          for i in $(seq 1 30); do curl -sf localhost:8000/health && break; sleep 1; done
          curl -sf localhost:8000/health | grep -q '"status":"ok"'
          # grid.parquet imajda yoksa /scenario 503 ve doğru komutu söyler (çökmez)
          code=$(curl -s -o out.json -w '%{http_code}' -X POST localhost:8000/scenario \
            -H 'Content-Type: application/json' -d '{"text":"toz","target_id":"mars_gale"}')
          cat out.json; echo
          if [ -f data/processed/grid.parquet ]; then test "$code" = 200; else test "$code" = 503; fi
      - name: Kayıtlar
        if: always()
        run: docker logs api || true

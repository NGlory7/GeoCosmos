# Frontend'i GitHub Pages'e yayınlar: https://<kullanıcı>.github.io/GeoCosmos/
# Statik: hazır sonuçlar (frontend/public/data) dahil; canlı senaryo API'si yok (kutu "çevrimdışı" der).
#
# Bir kerelik kurulum (repo sahibi):
#   1. Settings > Pages > Build and deployment > Source: "GitHub Actions"
#   2. Settings > Secrets and variables > Actions > Variables: PAGES_ENABLED = true
# Değişken yoksa push'ta iş atlanır (kırmızı olmaz); Actions sekmesinden elle de çalıştırılabilir.
name: yayin

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || vars.PAGES_ENABLED == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Derleme
        run: npm run build
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
          VITE_API_URL: ${{ vars.API_URL || '' }}
      - name: Tek sayfa uygulama yönlendirmesi (derin bağlantılar için 404.html)
        run: cp dist/index.html dist/404.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
